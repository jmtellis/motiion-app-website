<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:32px 20px;background:#f7f7f5;color:#202020;font-family:Arial,sans-serif;">
  <main style="max-width:480px;margin:auto;padding:32px;background:#ffffff;border-radius:16px;">
    <p style="font-weight:bold;letter-spacing:2px;">MOTIION</p>
    <h1 style="font-size:24px;">Verify your email</h1>
    <p>Enter this code to continue creating your account.</p>
    <p style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:32px;font-weight:bold;letter-spacing:4px;white-space:nowrap;text-align:center;padding:20px;background:#f3f4ef;border-radius:12px;">{{ .Token }}</p>
    <p>This code can only be used once. If it expires, request a new code from your verification screen.</p>
    <p style="font-size:13px;color:#666;">If you didn’t request this, you can ignore this email.</p>
  </main>
</body>
</html>
